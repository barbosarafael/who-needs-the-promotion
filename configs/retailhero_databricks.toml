# Runtime-only settings; authentication comes from an existing Databricks CLI profile.
# Supply an existing profile with --profile (or DATABRICKS_CONFIG_PROFILE).
# No workspace-specific profile or warehouse ID is committed here.
[retailhero]
catalog = "workspace"
bronze_schema = "retailhero_bronze"
silver_schema = "retailhero_silver"
gold_schema = "retailhero_gold"
staging_root = "/Volumes/workspace/default/retailhero_staging"
