# T1 data acquisition and storage configuration.
# Replace the revision/checksums after H0-approved acquisition. Do not put
# credentials or local absolute paths in this file.

[dataset]
name = "retailhero-uplift"
source_uri = "https://huggingface.co/datasets/pytorch-lifestream/retailhero-uplift"
source_revision = "7744156a4f89f4828607921e8c9668f04801f4de"
retrieved_at_utc = "2026-10-03 (downloaded; exact UTC time not recorded)"
checksum_algorithm = "sha256"
manifest_path = "configs/data_manifest.toml"

[paths]
raw_root = "data/raw"
interim_root = "data/interim"
processed_root = "data/processed"

[files]
clients = "clients.csv.gz"
products = "products.csv.gz"
purchases = "purchases.csv.gz"
uplift_train = "uplift_train.csv.gz"
uplift_test = "uplift_test.csv.gz"

[format]
type = "csv"
delimiter = ","
encoding = "utf-8"

[processing]
engine = "spark"
customer_output = "data/processed/customer_modeling.parquet"
transaction_aggregate_output = "data/interim/customer_transaction_aggregates.parquet"

[validation]
# Invariants are checked by T3 against the approved source revision.
modeling_grain = "one row per client_id per split"
purchase_duplicate_key = ["client_id", "transaction_datetime", "product_id"]
require_disjoint_modeling_splits = true
