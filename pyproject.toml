[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-name"
version = "0.1.0"
description = "Data Science / Machine Learning project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

ds = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "databricks_integration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks injects spark/dbutils/display at notebook runtime; scope F821 to this notebook only.
"notebooks/retailhero_exploration.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
