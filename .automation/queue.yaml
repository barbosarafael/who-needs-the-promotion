version: 1

settings:
  base_branch: main
  max_parallel: 2
  max_runtime_minutes: 60

checkpoints:
  H0:
    approved: true
    description: Data access / scope approved
  H1:
    approved: false
    description: Identification / data go-no-go
  H2:
    approved: false
    description: Feature / evaluation contract
  H3:
    approved: false
    description: Baseline quality gate
  H4:
    approved: false
    description: Model selection gate
  H5:
    approved: false
    description: Decision-use checkpoint
  H6:
    approved: false
    description: Release decision

